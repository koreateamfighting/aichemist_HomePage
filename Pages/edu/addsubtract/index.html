            animation-iteration-count:2;
            animation-duration: 0.5s;
            animation-direction: alternate;
            animation-fill-mode: forwards;
          }
          @-webkit-keyframes endeffect{
            0%{
              transform:scale(1.0);
            }
            100%{
              transform:scale(1.15);
            }
          }
          .targetresult{
            transition: 0.3s;
          }
          .targetresult.animate:hover{
            transform: scale(1.15);
          }
          input[type="number"]::-webkit-inner-spin-button {
              -webkit-appearance: none;
              margin: 0;
          }
          span{
            display:flex;
            width:35px;
            height:35px;
            border-radius: 50%;
            background-color: white;
            color: rgba(51, 51, 51, 1);
            cursor:pointer;
            font-size: 20px;
            align-items: center;
            justify-content: center;
            margin:2px;
          }
          .numberBalloon{
            display:none;
            margin-top:-230px;
            margin-left: -50px;
            flex-wrap: wrap;
            width:390px;
            height:40px;
            padding:10px 16px;
            background-color: rgba(255, 199, 115, 1);
            z-index: 10;
            border-radius: 22px;
          }
          .numberBalloon.bottom{
            margin-top:0px;
          }
          .numberBalloon:hover{
            display:flex;
          }
          .numberBalloon>span{
            display:flex;
            align-items: center;
            justify-content: center;
            padding-top:3px;
          }
          .numberBalloon>span:hover{
            background-color:rgba(252, 151, 0, 1);
            color:white;
          }
          .textBalloon>span{
            width:46px ;
            height:46px ;
            display:flex;
            align-items: center;
            font-size:30px !important;
            justify-content: center;
            padding-top:13px;
            font-family: TTHakgyoansimJiugaeR;
          }
          .textBalloon{
            display:none;
            align-items: center;
            justify-content: center;
            margin-top:-280px;
            margin-left: -50px;
            flex-wrap: wrap;
            width:130px;
            height:72px;
            padding:10px 16px;
            background-color: rgba(255, 199, 115, 1);
            z-index: 10;
            border-radius: 22px;
          }
          .textBalloon>span{
            width:50px;
            height:50px;
            font-size: 64px;
            padding-bottom: 6px;
          }
          .textBalloon>span:hover{
            background-color:rgba(252, 151, 0, 1);
            color:white;
          }
        </style>
      </div>
    </div>
  </body>
</html>
