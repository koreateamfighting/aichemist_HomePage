		$.ajax({ url: "https://api.ip.pe.kr/json" }).done(function (res) {
			console.log(res.country_code);
			if (res.country_code == "KR") {
				$(".korean").css("visibility", "visible")
				$(".english").css("visibility", "hidden")
                $(".korean").css("display", "block")
                $(".english").css("display", "none")
			} else {
                $(".korean").css("visibility", "hidden")
				$(".english").css("visibility", "visible")
                $(".korean").css("display", "none")
                $(".english").css("display", "block")
			}
		});
		function langChange(e) {
			//let value = $("#lang option:selected").val();
			console.log(value);
			if (value == "Korean") {
				$(".korean").css("visibility", "visible")
				$(".english").css("visibility", "hidden")
			} else if (value == "English") {
                $(".korean").css("visibility", "hidden")
                $(".english").css("visibility", "visible")
			}
		}
		function changeKorean() {
            $(".korean").css("visibility", "visible")
			$(".english").css("visibility", "hidden")
            $(".korean").css("display", "block")
            $(".english").css("display", "none")
			$("#liLangKor").hide();
			$("#liLangEng").show();
		}
		function changeEnglish() {
            $(".korean").css("visibility", "hidden")
			$(".english").css("visibility", "visible")
            $(".korean").css("display", "none")
            $(".english").css("display", "block")
            $("#liLangKor").show();
            $("#liLangEng").hide();
		}
		let largeHeader;
		let isMobile;

		let MainUtil = {
			init: function () {
				MainUtil.resizingFun.initHeader();
                MainUtil.resizingFun.addListeners();

                MainUtil.poPolHoverControl();
			},
            resizingFun: {
                initHeader: function (type) {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    target = { x: width / 2, y: height / 2 };

                    largeHeader = document.querySelector('.section_1');
                    largeHeader.style.height = height + 'px';
                    height = window.innerHeight;

                    isMobile = /Mobile|Android|iPhone/.test(navigator.userAgent);

                    if ($(".multiple-items").hasClass('slick-initialized')) {
                        $('.multiple-items').slick('unslick');
                    }


                    if (width > 1000) {
                        $('.multiple-items').slick({
                            infinite: true,
							arrows: false,
							autoplay: false,
                            autoplaySpeed: 1000,
                            slidesToShow: 4,
							slidesToScroll: 1
                            //cssEase: 'linear'//'easeInOut'
                        });
                        $("#pp_card").removeClass("pb-5");

                        $("#footer_div").children().each(function () {
                            $(this).attr("class", "footer-col align-content-center");

                        })
                        SecondSection(false);
                        $(".banner_img").attr("src", "/Docs/images/twinoffice_banner.png");

                    }

                    if (isMobile || width < 1001) {
                        $('.multiple-items').slick({
                            infinite: true,
                            arrows: false,
                            autoplay: false,
                            autoplaySpeed: 1000,
                            slidesToShow: 2,
                            slidesToScroll: 1
                        });

                        $("#pp_card").addClass("pb-5");
                        SecondSection(true);
                        $(".banner_img").attr("src", "/Docs/images/twinoffice_banner_mob.png");

                    }
                    AvatarSlideControl();

                }
                ,
                addListeners: function () {
                    window.addEventListener('resize', MainUtil.resizingFun.initHeader);

                },
                resize: function () {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    largeHeader.style.height = height + 'px';
                    canvas.width = width;
                    canvas.height = height;
                }

			},
			poPolHoverControl: function () {
                $('.pp').hover(
                    function () {
                        $(this).find('.pp_color_img').show();
                        $(this).find('.pp_black_img').animate({ opacity: 0 }, 500);
                        $(this).find('.pp_color_img').animate({ opacity: 1 }, 500);
                    },
                    function () {
                        $(this).find('.pp_color_img').animate({ opacity: 0 }, 500);
                        $(this).find('.pp_black_img').animate({ opacity: 1 }, 500);
                    }
                );
			},
			moveChapter: function (tag) {
                $(".animated").each(function () {
                    $(this).removeClass("animated");
                });
				let moveTarget = tag;
                $('html, body').animate({
					scrollTop: $('.section_' + moveTarget).offset().top
                }, 1000);
			}
		};

		function AvatarSlideControl() {

            let targetDiv = isMobile || window.innerWidth < 1001 ? "#sec_div" : "#forth_div";

            let widTemp = $(targetDiv).width();
            let heiTemp = $(targetDiv).height();

            let leftTemp = $(targetDiv).offset().left - (widTemp * 0.25);
            let topTemp = $(targetDiv).offset().top - (heiTemp*0.4);

            let deviceSize = heiTemp * 2.4;

			$("#mob_img").css({

				"height": deviceSize,
                "position": "absolute",
                "left": leftTemp  + "px",
                "top": topTemp  + "px",
				"z-index": "9"
            });
			$('.multiple-items').slick("slickPlay");

		}

		function SecondSection(dev) {
			if (dev) {
				$("#arrow_div").removeClass("row");
				$("#arrow_div").addClass("text-center");
				$("#arrow_img").addClass("fa-rotate-90");
			} else {

                $("#arrow_div").removeClass("text-center");
                $("#arrow_div").addClass("row");
                $("#arrow_img").removeClass("fa-rotate-90");
            }
		}

        $(document).ready(function () {
			MainUtil.init();

            var url = new URL(window.location.href);

            var searchParams = new URLSearchParams(url.search);

            var paramValue = searchParams.get('go');

			if (paramValue == "1")
				setTimeout(MainUtil.moveChapter("7"), 5000);

        });

        window.addEventListener("load", function () {
            // Hide the loading page when the DOM content is fully loaded
            $('.customloader').hide();
